spring.application.name=library-management
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5545/library_db
spring.datasource.username=library_user
spring.datasource.password=${LIBRARY_DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

# JWT
app.jwt.issuer=library-management
app.jwt.secret-base64=${LIBRARY_JWT_SECRET_BASE64}
app.jwt.access-token-minutes=30

# Local development bootstrap
app.bootstrap.admin.email=${LIBRARY_ADMIN_EMAIL:}
app.bootstrap.admin.password=${LIBRARY_ADMIN_PASSWORD:}

# Application port
server.port=${PORT:8080}

# Health monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false