# Standalone isolated stack: never combine with compose.yaml.
# Run with an explicit unique -p project name and --env-file outside the repository.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:?Set an isolated database password}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U library_user -d library_db]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: ""
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/library_db
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: ${LIBRARY_DB_PASSWORD:?Set an isolated database password}
      LIBRARY_JWT_SECRET_BASE64: ${LIBRARY_JWT_SECRET_BASE64:?Set an isolated JWT signing key}
      LIBRARY_EMAIL_ENABLED: "false"
    networks: [database, web]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 35s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-3100}:80"
    networks: [web]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  database:
    internal: true
  web:
volumes:
  staging_pg_data:
