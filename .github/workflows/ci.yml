name: Library Management CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local and isolated staging configurations
        env:
          LIBRARY_DB_PASSWORD: validation-only
          LIBRARY_JWT_SECRET_BASE64: validation-only
          LIBRARY_ADMIN_EMAIL: validation@example.invalid
          LIBRARY_ADMIN_PASSWORD: validation-only
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.staging.yaml config --quiet
