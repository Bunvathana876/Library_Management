spring.application.name=library-management
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5545/library_db
spring.datasource.username=library_user
spring.datasource.password=${LIBRARY_DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

# JWT
app.jwt.issuer=library-management
app.jwt.secret-base64=${LIBRARY_JWT_SECRET_BASE64}
app.jwt.access-token-minutes=30

# Local development bootstrap
app.bootstrap.admin.email=${LIBRARY_ADMIN_EMAIL:}
app.bootstrap.admin.password=${LIBRARY_ADMIN_PASSWORD:}

# Application port
server.port=${PORT:8080}

# Health monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=${LIBRARY_EMAIL_ENABLED:false}

# Swagger UI & OpenAPI (available at /swagger-ui.html)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# External Book Metadata Lookup (Open Library + optional Google Books fallback)
app.isbn.open-library.base-url=https://openlibrary.org
app.isbn.open-library.covers-base-url=https://covers.openlibrary.org
app.isbn.google-books.base-url=https://www.googleapis.com/books/v1
app.isbn.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
app.isbn.connect-timeout-ms=4000
app.isbn.read-timeout-ms=6000

# Circulation policy (fines & borrowing limits)
app.circulation.max-active-loans=${APP_MAX_ACTIVE_LOANS:5}
app.circulation.daily-fine-rate=${APP_DAILY_FINE_RATE:0.50}
app.circulation.fine-block-threshold=${APP_FINE_BLOCK_THRESHOLD:10.00}
app.circulation.due-soon-days=${APP_DUE_SOON_DAYS:2}

# Notifications & optional SMTP / Mailpit email alerts
app.notifications.email.enabled=${LIBRARY_EMAIL_ENABLED:false}
app.notifications.email.from=${LIBRARY_EMAIL_FROM:no-reply@athenaeum.local}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Scheduled maintenance jobs
app.scheduling.hold-expiry-cron=${APP_HOLD_EXPIRY_CRON:0 0 2 * * *}
app.scheduling.due-reminders-cron=${APP_DUE_REMINDERS_CRON:0 0 8 * * *}
