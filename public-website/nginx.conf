server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Resolve at request time so an unavailable API cannot prevent static startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/api/books(?:/categories|/[0-9]+)?$ {
        limit_except GET { deny all; }
        set $catalog_api http://api:8080;
        proxy_pass $catalog_api$request_uri;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/ { return 404; }
    location /actuator/ { return 404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location /fonts/ { try_files $uri =404; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
